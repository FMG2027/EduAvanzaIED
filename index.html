.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px auto;max-width:1100px}
.bar input{flex:1 1 200px;min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--fg);font:inherit}
button{font:inherit;padding:7px 11px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--fg);cursor:pointer}
button:hover{border-color:var(--fg)}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--mut);max-width:1100px;margin:0 auto 10px}
.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.cnt{font-size:13px;color:var(--mut)}
#vp{height:min(72vh,760px);overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel);cursor:grab;-webkit-overflow-scrolling:touch}

#sz{position:relative}
#cv{position:absolute;left:0;top:0;transform-origin:0 0}
svg{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
svg path{fill:none;stroke-width:1.6;opacity:.55}
.n{position:absolute;padding:6px 10px;border-radius:9px;border:1px solid color-mix(in srgb,var(--cc) 45%,var(--line));border-left:4px solid var(--cc);background:color-mix(in srgb,var(--cc) 8%,var(--panel));font-size:13.5px;cursor:default}
.n.has{cursor:pointer}
.n.d0{width:210px;font:600 18px/1.15 Fraunces,Georgia,serif;background:var(--c0);color:var(--bg);border-color:var(--c0)}

.n.d2{width:230px;font-weight:600}
.n.g{width:190px;font-weight:600;border-style:dashed;color:var(--cc)}
.n.r{width:360px;font-size:13px}
.n:not(.d0):not(.d1):not(.g):not(.r):not(.d2){width:250px}
.b{display:inline-block;font-size:11px;font-weight:600;padding:0 6px;border-radius:5px;background:var(--cc);color:var(--bg);margin-right:6px;vertical-align:1px}
.fx{display:block;margin-top:3px;font-size:11.5px;color:var(--warn)}
.tg{float:right;margin-left:8px;font-size:11px;opacity:.8}
.n.hit{outline:3px solid var(--hit)}
footer{max-width:1100px;margin:12px auto 0;font-size:13px;color:var(--mut)}
</style>
</head>

const cv=document.getElementById('cv'),sv=document.getElementById('sv'),vp=document.getElementById('vp'),sz=document.getElementById('sz');
let id=0,all=[],scale=innerWidth<700?.7:.9,showR=false;
function prep(n,d,col,p){n.id=id++;n.d=d;n.p=p;if(d===1)col=n.k;n.col=col;n.open=d<2;all.push(n);(n.c||[]).forEach(c=>prep(c,d+1,col,n))}
prep(DATA,0,0,null);

function cls(n){return n.p?'r':n.g?'g':'d'+Math.min(n.d,3)}
function vis(n,a){a.push(n);if(n.open&&n.c)n.c.forEach(c=>vis(c,a));return a}
function render(){
 cv.querySelectorAll('.n').forEach(e=>e.remove());sv.innerHTML='';
 const v=vis(DATA,[]);
 v.forEach(n=>{const e=document.createElement('div');e.className='n '+cls(n)+(n.c?' has':'')+(n.hit?' hit':'');e.style.setProperty('--cc','var(--c'+n.col+')');
  let h='';h+=n.t;
  if(n.c)h='<span class="tg">'+(n.open?'◀':'▶ '+n.c.length)+'</span>'+h;
  e.innerHTML=h;e.onclick=()=>{if(n.c){n.open=!n.open;render()}};cv.appendChild(e);n.e=e;n.w=e.offsetWidth;n.h=e.offsetHeight});
 const gap=8,gx=56;
 (function sh(n){const k=n.open&&n.c?n.c:[];k.forEach(sh);n.sh=k.length?Math.max(n.h,k.reduce((s,c)=>s+c.sh,0)+gap*(k.length-1)):n.h})(DATA);
 let mx=0,my=0;
 (function pl(n,top,x){n.x=x;const k=n.open&&n.c?n.c:[];
  if(k.length){const tot=k.reduce((s,c)=>s+c.sh,0)+gap*(k.length-1);let cur=top+Math.max(0,(n.sh-tot)/2);k.forEach(c=>{pl(c,cur,x+n.w+gx);cur+=c.sh+gap});n.cy=(k[0].cy+k[k.length-1].cy)/2}else n.cy=top+n.sh/2;
  n.y=n.cy-n.h/2;n.e.style.left=n.x+'px';n.e.style.top=n.y+'px';mx=Math.max(mx,n.x+n.w);my=Math.max(my,n.y+n.h)})(DATA,10,10);
 let p='';v.forEach(n=>{if(n.open&&n.c)n.c.forEach(c=>{const x1=n.x+n.w,y1=n.cy,x2=c.x,y2=c.cy,m=(x1+x2)/2;p+='<path d="M'+x1+','+y1+'C'+m+','+y1+' '+m+','+y2+' '+x2+','+y2+'" style="stroke:var(--c'+c.col+')"/>'});});
 sv.innerHTML=p;const W=mx+20,H=my+20;sv.setAttribute('width',W);sv.setAttribute('height',H);
 cv.style.width=W+'px';cv.style.height=H+'px';cv.style.transform='scale('+scale+')';sz.style.width=W*scale+'px';sz.style.height=H*scale+'px';

}
const setAll=(o,gOnly)=>{all.forEach(n=>{if(n.c){if(gOnly){if(n.g)n.open=o}else n.open=o}});};
document.getElementById('ex').onclick=()=>{setAll(true);render()};
document.getElementById('co').onclick=()=>{all.forEach(n=>{if(n.c)n.open=n.d<2});render()};
document.getElementById('zi').onclick=()=>{scale=Math.min(1.5,scale+.1);render()};
document.getElementById('zo').onclick=()=>{scale=Math.max(.3,scale-.1);render()};
const nz=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
document.getElementById('q').oninput=function(){const q=nz(this.value.trim());all.forEach(n=>n.hit=false);
 if(q.length>1){let first=null;all.forEach(n=>{if(nz(n.t).includes(q)){n.hit=true;for(let a=n.p;a;a=a.p)a.open=true;if(!first)first=n}});render();
  if(first){vp.scrollTo({left:Math.max(0,first.x*scale-40),top:Math.max(0,first.cy*scale-vp.clientHeight/2),behavior:'smooth'})}}else render()};
let dr=null;vp.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button===0)dr={x:e.clientX,y:e.clientY,l:vp.scrollLeft,t:vp.scrollTop,m:0}});
addEventListener('pointermove',e=>{if(!dr)return;const dx=e.clientX-dr.x,dy=e.clientY-dr.y;if(Math.abs(dx)+Math.abs(dy)>4){dr.m=1;vp.classList.add('drag')}if(dr.m){vp.scrollLeft=dr.l-dx;vp.scrollTop=dr.t-dy}});
addEventListener('pointerup',()=>{dr=null;vp.classList.remove('drag')});
render();vp.scrollTop=Math.max(0,DATA.cy*scale-vp.clientHeight/2);
